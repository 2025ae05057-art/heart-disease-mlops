name: MLOps CI
on:
  push:
  pull_request:
jobs:
  quality-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests --output-format=github --select E9,F63,F7,F82
      - run: pytest tests -v
      - name: Train, evaluate and log experiments
        run: python app/train.py --quick
      - name: Upload reports and MLflow runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-ci-artifacts
          path: |
            reports/
            mlruns/
          if-no-files-found: warn
